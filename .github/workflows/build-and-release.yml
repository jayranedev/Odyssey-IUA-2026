name: Build & Release Apps

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        working-directory: ./expo-app
        run: npm install

      - name: Expo Prebuild
        working-directory: ./expo-app
        run: npx expo prebuild -p android --clean

      - name: Build APK (Release)
        working-directory: ./expo-app/android
        run: ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JugaadGPT.apk
          path: expo-app/android/app/build/outputs/apk/release/app-release.apk

  build-extension:
    name: Build Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./jugaadgpt-frontend/extension
        run: npm install

      - name: Build Extension
        working-directory: ./jugaadgpt-frontend/extension
        run: npm run build

      - name: Zip Extension
        working-directory: ./jugaadgpt-frontend/extension/dist
        run: zip -r ../../../jugaadgpt-extension-latest.zip .

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jugaadgpt-extension-latest.zip
          path: jugaadgpt-extension-latest.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-apk, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: JugaadGPT.apk
          path: ./release-artifacts

      - name: Download Extension
        uses: actions/download-artifact@v4
        with:
          name: jugaadgpt-extension-latest.zip
          path: ./release-artifacts

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Auto-Build"
          files: ./release-artifacts/*
          draft: false
          prerelease: false
          make_latest: true
