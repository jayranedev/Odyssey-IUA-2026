# Free-tier keep-alive.
#
# - Every 5 minutes: GET $KEEPALIVE_API_URL/health so the Render free service
#   is much less likely to idle out.
# - Daily: GET $KEEPALIVE_API_URL/health/db (runs SELECT 1 on Postgres) so the
#   Supabase free-tier project is never paused for inactivity.
#
# ⚠️ AFTER PUSHING, YOU MUST:
#   1. Enable GitHub Actions for the repo (Settings → Actions → Allow).
#   2. Optional: add repo secret or variable KEEPALIVE_API_URL to override the
#      default Render URL below.
# Scheduled workflows on free GitHub are best-effort (may lag a few minutes)
# and are auto-disabled after 60 days without repo activity — a monthly commit
# or a UptimeRobot monitor keeps them alive.

name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"    # API ping every 5 minutes
    - cron: "17 3 * * *"     # DB ping daily at 03:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      KEEPALIVE_API_URL: ${{ secrets.KEEPALIVE_API_URL || vars.KEEPALIVE_API_URL || 'https://odyssey-iua-2026-1.onrender.com' }}
    steps:
      - name: Ping API /health
        if: github.event.schedule != '17 3 * * *'
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$KEEPALIVE_API_URL/health" && echo " ok"

      - name: Ping DB /health/db (keeps Supabase awake)
        if: github.event.schedule == '17 3 * * *' || github.event_name == 'workflow_dispatch'
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 "$KEEPALIVE_API_URL/health/db" && echo " ok"
