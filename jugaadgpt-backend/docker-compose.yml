services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jugaadgpt
      POSTGRES_USER: jugaad
      POSTGRES_PASSWORD: jugaad_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jugaad -d jugaadgpt"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
