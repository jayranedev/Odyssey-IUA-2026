# Production stack: FastAPI (gunicorn+uvicorn) + Postgres/pgvector + Redis + Caddy (auto-HTTPS).
# Usage:
#   cp .env.example .env   # fill in keys + DOMAIN
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec api alembic upgrade head
#   docker compose -f docker-compose.prod.yml exec api python scripts/reembed_cases.py

services:
  api:
    build:
      context: .
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jugaad:${POSTGRES_PASSWORD:-jugaad_secret}@postgres:5432/jugaadgpt
      DATABASE_URL_SYNC: postgresql://jugaad:${POSTGRES_PASSWORD:-jugaad_secret}@postgres:5432/jugaadgpt
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: jugaadgpt
      POSTGRES_USER: jugaad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jugaad_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jugaad -d jugaadgpt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
